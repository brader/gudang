<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RakStok Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RakStok Scan</title>
<style>
:root {
  --bg: #f1f5f9; --surface: #fff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
  --primary: #1d4ed8; --primary-soft: #dbeafe; --success: #16a34a; --danger: #dc2626; --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
header { background: var(--primary); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
header b { flex: 1; font-size: 16px; }
header a, header button { color: #dbeafe; background: none; border: 0; font-size: 13px; text-decoration: none; cursor: pointer; }
.modes { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); }
.mode { flex: 1 0 auto; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.mode.on { background: var(--primary); border-color: var(--primary); color: #fff; }
main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.cam { background: #0b1220; border-radius: 14px; overflow: hidden; position: relative; min-height: 220px; }
#reader { width: 100%; }
#reader video { width: 100% !important; display: block; }
.cam-off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #cbd5e1; text-align: center; padding: 24px; }
.cam-btn { position: absolute; right: 10px; bottom: 10px; z-index: 3; }
.flash { position: absolute; inset: 0; background: rgba(34,197,94,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 2; }
.flash.on { opacity: 1; transition: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 15px; cursor: pointer; background: #fff; }
.btn:disabled { opacity: .5; }
.btn-p { background: var(--primary); color: #fff; }
.btn-o { border-color: var(--border); }
.btn-g { background: var(--success); color: #fff; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.inp { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; font-size: 16px; background: #fff; }
.manual { display: flex; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.card-h { padding: 11px 14px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-b { padding: 12px 14px; }
.ctx { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; background: var(--primary-soft); color: #1e3a8a; font-weight: 600; font-size: 14px; }
.chip.empty { background: #fff7ed; color: #9a3412; }
.chip code { font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
.item:first-child { border-top: 0; }
.item .nm { flex: 1; min-width: 0; }
.item .nm div:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.qty { display: flex; align-items: center; gap: 4px; }
.qty button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
.qty input { width: 64px; text-align: center; border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; font-size: 16px; font-weight: 700; }
.sel { font-size: 12.5px; font-weight: 700; min-width: 44px; text-align: right; }
.footer-bar { position: sticky; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(241,245,249,.96); border-top: 1px solid var(--border); display: flex; gap: 8px; }
.footer-bar .btn { flex: 1; }
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 20; pointer-events: none; }
.toast { background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.err { background: var(--danger); }
.login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #1d4ed8, #0f172a); }
.login .card { width: 100%; max-width: 360px; padding: 24px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>
<script src="vendor/html5-qrcode.min.js?v=1.5"></script>
<script src="scan.js?v=1.5"></script>
</body>
</html>
